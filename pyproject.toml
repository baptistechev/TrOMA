[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "troma"
version = "2.0"
description = "Optimization tools for research"
authors = [
  {name = "Baptiste Chevalier"}
]
dependencies = [
  "numpy",
  "scipy",
  "dwave-neal",
  "qiskit",
  "qiskit-aer",
  "qiskit_ibm_runtime",
  "qamomile @ git+https://github.com/baptistechev/Qamomile.git@feature/alternating_ansatz",
  "qaoa_training_pipeline @ git+https://github.com/qiskit-community/qaoa_training_pipeline@6cb3ee050ecdbfa28939c7533f6122464b4891ac",
  # Must stay on the same commit that qaoa_training_pipeline pins: pip rejects
  # two different direct URLs for the same distribution.
  "qopt-best-practices @ git+https://github.com/qiskit-community/qopt-best-practices.git@a861d46e6d77c64b87124a50216995d2d2d6d5fe"
]

[tool.setuptools.packages.find]
where = ["src"]