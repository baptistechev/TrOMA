[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "troma"
version = "1.1"
description = "Optimization tools for research"
authors = [
  {name = "Baptiste Chevalier"}
]
dependencies = [
  "numpy",
  "scipy",
  "dwave-neal",
  "qiskit_ibm_runtime",
  "qamomile @ git+https://github.com/baptistechev/Qamomile.git@feature/alternating_ansatz",
  "qaoa_training_pipeline @ git+https://github.com/qiskit-community/qaoa_training_pipeline"
]

[tool.setuptools.packages.find]
where = ["src"]